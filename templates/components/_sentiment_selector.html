<div class="sentiment-selector-wrapper">
  <label class="sentiment-selector-label">Sentiment Rating</label>
  <input type="hidden" name="rating" id="rating" value="{{ initial_rating | default(3) }}" required />
  
  <div class="sentiment-selector" role="radiogroup" aria-label="Sentiment Rating Selector">
    <!-- Level 1: Hated it -->
    <button type="button" 
            class="sentiment-option {% if (initial_rating | default(3) | int) == 1 %}active{% endif %}" 
            data-level="1" 
            role="radio" 
            aria-checked="{% if (initial_rating | default(3) | int) == 1 %}true{% else %}false{% endif %}"
            title="1 - Hated it">
      <svg viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        <polyline points="12 3 9 8.5 14 13 9.5 17.5 12 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sentiment-text">Hated it</span>
    </button>

    <!-- Level 2: Disliked it -->
    <button type="button" 
            class="sentiment-option {% if (initial_rating | default(3) | int) == 2 %}active{% endif %}" 
            data-level="2" 
            role="radio" 
            aria-checked="{% if (initial_rating | default(3) | int) == 2 %}true{% else %}false{% endif %}"
            title="2 - Disliked it">
      <svg viewBox="0 0 24 24">
        <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>
      </svg>
      <span class="sentiment-text">Disliked it</span>
    </button>

    <!-- Level 3: OK -->
    <button type="button" 
            class="sentiment-option {% if (initial_rating | default(3) | int) == 3 %}active{% endif %}" 
            data-level="3" 
            role="radio" 
            aria-checked="{% if (initial_rating | default(3) | int) == 3 %}true{% else %}false{% endif %}"
            title="3 - OK">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span class="sentiment-text">OK</span>
    </button>

    <!-- Level 4: Liked it -->
    <button type="button" 
            class="sentiment-option {% if (initial_rating | default(3) | int) == 4 %}active{% endif %}" 
            data-level="4" 
            role="radio" 
            aria-checked="{% if (initial_rating | default(3) | int) == 4 %}true{% else %}false{% endif %}"
            title="4 - Liked it">
      <svg viewBox="0 0 24 24">
        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
      </svg>
      <span class="sentiment-text">Liked it</span>
    </button>

    <!-- Level 5: Loved it -->
    <button type="button" 
            class="sentiment-option {% if (initial_rating | default(3) | int) == 5 %}active{% endif %}" 
            data-level="5" 
            role="radio" 
            aria-checked="{% if (initial_rating | default(3) | int) == 5 %}true{% else %}false{% endif %}"
            title="5 - Loved it">
      <svg viewBox="0 0 24 24">
        <path d="M2 4l3 12h14l3-12-6 7-4-5-4 5-6-7z"/>
      </svg>
      <span class="sentiment-text">Loved it</span>
    </button>
  </div>
</div>

<script>
  (function() {
    const hiddenInput = document.getElementById('rating');
    const options = document.querySelectorAll('.sentiment-option');

    function selectSentiment(level) {
      if (!hiddenInput) return;
      hiddenInput.value = level;
      options.forEach(opt => {
        const isSelected = opt.getAttribute('data-level') === String(level);
        if (isSelected) {
          opt.classList.add('active');
          opt.setAttribute('aria-checked', 'true');
        } else {
          opt.classList.remove('active');
          opt.setAttribute('aria-checked', 'false');
        }
      });
    }

    options.forEach(opt => {
      opt.addEventListener('click', function() {
        const level = this.getAttribute('data-level');
        selectSentiment(level);
      });

      opt.addEventListener('keydown', function(e) {
        let currentLevel = parseInt(hiddenInput.value) || 3;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          const nextLevel = Math.min(5, currentLevel + 1);
          selectSentiment(nextLevel);
          const nextBtn = document.querySelector(`.sentiment-option[data-level="${nextLevel}"]`);
          if (nextBtn) nextBtn.focus();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          const prevLevel = Math.max(1, currentLevel - 1);
          selectSentiment(prevLevel);
          const prevBtn = document.querySelector(`.sentiment-option[data-level="${prevLevel}"]`);
          if (prevBtn) prevBtn.focus();
        }
      });
    });

    window.setSentimentRating = selectSentiment;
  })();
</script>
