{% extends 'base.html' %} {% block title %}Register{% endblock %} {% block
content %}



<style>
  .register-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 2rem;
  }

  .register-main h1 {
    font-family: "VT323", "Courier New", monospace;
    font-size: 3rem;
    letter-spacing: 3px;
    margin-bottom: 2rem;
  }

  .register-main form {
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
  }

  .register-main .field {
    margin-bottom: 2rem;
  }

  .register-main .input {
    font-family: "VT323", "Courier New", monospace;
    font-size: 1.3rem;
  }

  .register-main .label {
    font-family: "VT323", "Courier New", monospace;
    font-size: 1.2rem;
  }

  .register-main .button {
    font-family: "VT323", "Courier New", monospace;
    font-size: 1.3rem;
    letter-spacing: 1px;
    padding: 0.8rem 2rem;
  }

  .register-main .buttons {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .register-main .buttons p {
    font-family: "VT323", "Courier New", monospace;
    font-size: 1.1rem;
    color: #b0bec5;
    margin: 0;
  }

  .register-main .buttons a {
    font-family: "VT323", "Courier New", monospace;
    font-size: 1.1rem;
  }

  .register-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 2rem;
    align-items: center;
    margin-top: 1rem;
  }

  @media (max-width: 600px) {
    .register-main {
      padding: 1rem;
      min-height: 70vh;
    }

    .register-main h1 {
      font-size: 2.2rem;
    }

    .register-main form {
      max-width: 100%;
      padding: 0 1rem;
    }

    .register-main .input,
    .register-main .label {
      font-size: 1.1rem;
    }

    .register-main .button {
      width: 100%;
      text-align: center;
    }

    .register-links {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .register-links p {
      margin: 0;
    }
  }
</style>

<main class="register-main">
  <h1>Register</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field">
      <input
        type="text"
        name="username"
        class="input"
        placeholder=" "
        required
      />
      <label for="username" class="label">Username</label>
    </div>
    <div class="field">
      <input type="email" name="email" class="input" placeholder=" " required />
      <label for="email" class="label">Email</label>
    </div>
    <div class="field">
      <input
        type="password"
        name="password"
        class="input"
        placeholder=" "
        required
      />
      <label for="password" class="label">Password</label>
    </div>
    <div class="field">
      <input
        type="password"
        name="confirm_password"
        class="input"
        placeholder=" "
        required
      />
      <label for="confirm_password" class="label">Confirm Password</label>
    </div>

    <div class="buttons">
      <button type="submit" class="button button-Login">Register</button>
      <div class="register-links">
        <p>Already have an account? <a href="/login">Login</a></p>
      </div>
    </div>
  </form>
</main>
{% endblock %}
