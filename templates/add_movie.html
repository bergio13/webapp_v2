{% extends 'base.html' %} {% block title %}Add Movie{% endblock %} {% block
content %}

<!-- VT323 Terminal Font -->
<link
  href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
  rel="stylesheet"
/>

<style>
  .add-movie-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 80vh;
    padding: 2rem;
    padding-top: 1rem;
  }

  .add-movie-main h1 {
    font-family: "VT323", "Courier New", monospace;
    font-size: 3rem;
    letter-spacing: 3px;
    color: yellow;

  }

  .add-movie-main form {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
  }

  .add-movie-main .field {
    margin-bottom: 1.5rem;
    position: relative;
  }

  .add-movie-main .input,
  .add-movie-main .number,
  .add-movie-main .month {
    font-family: "VT323", monospace;
    font-size: 1.5rem;
    outline: none;
    border: none;
    width: 100%;
    padding: 0.5rem 0;
    background: none;
    color: var(--text-secondary);
  }

  .add-movie-main .input:valid,
  .add-movie-main .number:valid,
  .add-movie-main .month:valid {
    color: var(--text-secondary);
  }

  .add-movie-main .label {
    font-family: "VT323", monospace;
    font-size: 1.4rem;
    color: var(--text-primary);
  }

  .add-movie-main .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .add-movie-main .radio-group {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    font-family: "VT323", monospace;
    font-size: 1.4rem;
    color: var(--text-primary);
    border-bottom: 2px dashed var(--app-panel-border);
    padding-bottom: 0.8rem;
  }

  .add-movie-main .radio-group label {
    min-width: 180px;
  }

  .add-movie-main .radio-option {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    color: white;
    cursor: pointer;
  }

  .add-movie-main .radio-option input[type="radio"] {
    accent-color: var(--theme-accent);
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .add-movie-main .button {
    font-family: "VT323", monospace;
    font-size: 1.6rem;
    letter-spacing: 2px;
    padding: 0.8rem 2rem;
    margin-top: 1rem;
    background: transparent;
    color: var(--theme-accent);
    border: 2px solid var(--theme-accent);
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .add-movie-main .button:hover {
    background: var(--theme-accent-soft);
    box-shadow: 0 0 10px rgba(131, 111, 255, 0.4);
    transform: scale(1.02);
  }

  .add-movie-main .season-counter {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--app-panel-border);
    border-radius: 8px;
    padding: 0.2rem 0.5rem;
  }
  .add-movie-main .season-btn {
    background: transparent;
    color: var(--theme-accent);
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s ease;
    padding: 0 0.5rem;
  }
  .add-movie-main .season-btn:hover {
    color: var(--theme-accent-soft);
  }
  .add-movie-main .season-input {
    width: 50px;
    text-align: center;
    padding: 0;
    margin: 0;
    font-size: 1.4rem;
    color: white;
  }
  .add-movie-main .season-input::-webkit-inner-spin-button,
  .add-movie-main .season-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .autocomplete-items {
    position: absolute;
    border: 1px solid var(--app-panel-border);
    z-index: 99;
    top: 100%;
    margin-top: 4px;
    left: 0;
    right: 0;
    background-color: var(--app-panel-bg);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    max-height: 300px;
    overflow-y: auto;
    font-family: inherit;
    box-shadow: var(--app-panel-shadow);
  }

  .autocomplete-items::-webkit-scrollbar {
    width: 6px;
  }
  
  .autocomplete-items::-webkit-scrollbar-track {
    background: transparent;
  }
  
  .autocomplete-items::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }

  .autocomplete-item {
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 15px;
    color: var(--text-primary);
    transition: all 0.2s ease;
  }

  .autocomplete-item:last-child {
    border-bottom: none;
  }

  .autocomplete-item:hover {
    background-color: rgba(255, 255, 255, 0.08);
    color: white;
  }

  .autocomplete-item img {
    width: 40px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .autocomplete-item .item-title {
    font-size: 1.1rem;
    color: var(--text-secondary);
    font-weight: bold;
    transition: color 0.2s ease;
  }

  .autocomplete-item:hover .item-title {
    color: var(--theme-accent);
  }

  .autocomplete-item .item-year {
    font-size: 0.9rem;
    color: var(--text-primary);
    margin-top: 4px;
  }

  .autocomplete-item .item-type {
    font-size: 0.75rem;
    background: var(--theme-accent-soft);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 10px;
    color: var(--theme-accent);
    text-transform: uppercase;
    font-weight: bold;
    border: 1px solid rgba(131, 111, 255, 0.3);
  }

  @media (max-width: 600px) {
    .add-movie-main {
      padding: 1rem;
    }

    .add-movie-main h1 {
      font-size: 2rem;
    }

    .add-movie-main form {
      max-width: 100%;
      padding: 0 0.5rem;
    }

    .add-movie-main .field-group {
      grid-template-columns: 1fr;
      gap: 0;
    }

    .add-movie-main .radio-group {
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .add-movie-main .radio-group label {
      width: 100%;
      min-width: unset;
    }

    .add-movie-main .button {
      width: 100%;
      margin-bottom: 6rem;
    }
  }
</style>


<main class="add-movie-main">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field">
      <input type="text" class="input" id="title" name="title" placeholder=" " autocomplete="off" required />
      <label for="title" class="label">Title</label>
      <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>
    <input type="hidden" id="year" name="year" />
    {% include 'components/_sentiment_selector.html' %}
    <div class="field">
      <input type="text" class="input" id="director" name="director" placeholder=" " />
      <label for="director" class="label">Director (optional)</label>
    </div>
    <div class="field">
      <input type="date" class="input" id="date" name="date" required />
      <label for="date" class="label">Watch Date</label>
    </div>
    <div class="radio-group">
      <label for="rewatch">Rewatch</label>
      <input type="radio" class="radio-option" name="rewatch" id="rewatch_yes" value=1>Yes</input>
      <input type="radio" class="radio-option" name="rewatch" id="rewatch_no" value=0 checked>No</input>
    </div>
    <div class="radio-group">
      <label for="tv">Tv show</label>
      <input type="radio" class="radio-option" name="tv" id="tv_yes" onclick="showSeasonField()" value=1>Yes</input>
      <input type="radio" class="radio-option" name="tv"  id="tv_no" checked onclick="hideSeasonField()" value=0 checked>No</input>
    </div>
    <div class="radio-group" id="seasonField" style="display: none;">
      <label for="season">Season</label>
      <div class="season-counter">
        <button type="button" class="season-btn" onclick="document.getElementById('season').stepDown()">-</button>
        <input type="number" class="input season-input" id="season" name="season" value="1" min="1" />
        <button type="button" class="season-btn" onclick="document.getElementById('season').stepUp()">+</button>
      </div>
    </div>
    <div class="radio-group">
      <label for="tv">Watched at the cinema?</label>
      <input type="radio" class="radio-option" name="cinema" id="cinema_yes" value=1>Yes</input>
      <input type="radio" class="radio-option" name="cinema"  id="cinema_no" value=0 checked>No</input>
    </div>
    <button type="submit" class="button">[ SUBMIT ]</button>
  </form>
  <script>
    function showSeasonField() {
      document.getElementById("seasonField").style.display = "block";
    }

    function hideSeasonField() {
      document.getElementById("seasonField").style.display = "none";
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Default date to today if empty
      const dateInput = document.getElementById('date');
      if (!dateInput.value) {
        dateInput.valueAsDate = new Date();
      }

      const titleInput = document.getElementById('title');
      const autocompleteList = document.getElementById('autocomplete-list');
      let timeout = null;

      titleInput.addEventListener('input', function() {
        clearTimeout(timeout);
        const query = this.value;
        
        if (!query || query.length < 2) {
          autocompleteList.innerHTML = '';
          return;
        }

        timeout = setTimeout(() => {
          // Send tv parameter just in case backend expects it, but backend will ignore it and return both
          const isTv = document.getElementById('tv_yes').checked ? "1" : "0";
          fetch(`/search_tmdb?q=${encodeURIComponent(query)}&tv=${isTv}`)
            .then(response => response.json())
            .then(data => {
              autocompleteList.innerHTML = '';
              data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                const typeLabel = item.type === 'tv' ? 'TV' : 'Movie';
                div.innerHTML = `
                  <img src="${item.poster}" alt="Poster" />
                  <div class="info">
                    <div class="item-title">${item.title} <span class="item-type">${typeLabel}</span></div>
                    <div class="item-year">${item.year}</div>
                  </div>
                `;
                div.addEventListener('click', function() {
                  titleInput.value = item.title;
                  document.getElementById('year').value = item.year;
                  
                  if (item.type === 'tv') {
                    document.getElementById('tv_yes').checked = true;
                    showSeasonField();
                  } else {
                    document.getElementById('tv_no').checked = true;
                    hideSeasonField();
                  }

                  autocompleteList.innerHTML = '';
                  
                  // Fetch director
                  const dirInput = document.getElementById('director');
                  dirInput.value = 'Loading...';
                  fetch(`/api/director?id=${item.id}&type=${item.type}`)
                    .then(res => res.json())
                    .then(data => {
                        if(data.director) {
                            dirInput.value = data.director;
                        } else {
                            dirInput.value = '';
                        }
                    })
                    .catch(() => dirInput.value = '');
                });
                autocompleteList.appendChild(div);
              });
            })
            .catch(err => console.error("Error fetching autocomplete:", err));
        }, 300);
      });

      // Close autocomplete when clicking outside
      document.addEventListener('click', function(e) {
        if (e.target !== titleInput && e.target !== autocompleteList && !autocompleteList.contains(e.target)) {
          autocompleteList.innerHTML = '';
        }
      });
    });
  </script>
</main>

{% endblock %}
