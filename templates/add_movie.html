{% extends 'base.html' %} {% block title %}Add Movie{% endblock %} {% block
content %}



<style>
  .add-movie-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 80vh;
    padding: 2rem;
    padding-top: 1rem;
  }

  .add-movie-main h1 {
    font-family: "VT323", "Courier New", monospace;
    font-size: 3rem;
    letter-spacing: 3px;
    color: yellow;

  }

  .add-movie-main form {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
  }

  .add-movie-main .field {
    margin-bottom: 1.5rem;
    position: relative;
  }

  .add-movie-main .input,
  .add-movie-main .number,
  .add-movie-main .month {
    font-family: "VT323", monospace;
    font-size: 1.5rem;
    outline: none;
    border: none;
    width: 100%;
    padding: 0.5rem 0;
    background: none;
    color: var(--text-secondary);
  }

  .add-movie-main .input:valid,
  .add-movie-main .number:valid,
  .add-movie-main .month:valid {
    color: var(--text-secondary);
  }

  .add-movie-main .label {
    font-family: "VT323", monospace;
    font-size: 1.4rem;
    color: var(--text-primary);
  }

  .add-movie-main .field-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
  }

  .add-movie-main .radio-group {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    font-family: "VT323", monospace;
    font-size: 1.4rem;
    color: var(--text-primary);
    border-bottom: 2px dashed var(--app-panel-border);
    padding-bottom: 0.8rem;
  }

  .add-movie-main .radio-group label {
    min-width: 180px;
  }

  .add-movie-main .radio-option {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    color: white;
    cursor: pointer;
  }

  .add-movie-main .radio-option input[type="radio"] {
    accent-color: var(--theme-accent);
    width: 18px;
    height: 18px;
    cursor: pointer;
  }

  .add-movie-main .button {
    font-family: "VT323", monospace;
    font-size: 1.6rem;
    letter-spacing: 2px;
    padding: 0.8rem 2rem;
    margin-top: 1rem;
    background: transparent;
    color: var(--theme-accent);
    border: 2px solid var(--theme-accent);
    border-radius: 99px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .add-movie-main .button:hover:not(:disabled) {
    background: var(--theme-accent-soft);
    box-shadow: 0 0 10px rgba(131, 111, 255, 0.4);
    transform: scale(1.02);
  }

  .add-movie-main .button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
    border-color: rgba(131, 111, 255, 0.4);
  }

  .add-movie-main .season-counter {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--app-panel-border);
    border-radius: 8px;
    padding: 0.2rem 0.5rem;
  }
  .add-movie-main .season-btn {
    background: transparent;
    color: var(--theme-accent);
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s ease;
    padding: 0 0.5rem;
  }
  .add-movie-main .season-btn:hover {
    color: var(--theme-accent-soft);
  }
  .add-movie-main .season-input {
    width: 50px;
    text-align: center;
    padding: 0;
    margin: 0;
    font-size: 1.4rem;
    color: white;
  }
  .add-movie-main .season-input::-webkit-inner-spin-button,
  .add-movie-main .season-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .autocomplete-items {
    position: absolute;
    border: 1px solid var(--app-panel-border);
    z-index: 99;
    top: 100%;
    margin-top: 4px;
    left: 0;
    right: 0;
    background-color: var(--app-panel-bg);
    backdrop-filter: blur(10px);
    border-radius: 12px;
    max-height: 380px;
    overflow-y: auto;
    font-family: inherit;
    box-shadow: var(--app-panel-shadow);
  }

  .autocomplete-items::-webkit-scrollbar {
    width: 6px;
  }
  
  .autocomplete-items::-webkit-scrollbar-track {
    background: transparent;
  }
  
  .autocomplete-items::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
  }

  .autocomplete-item {
    padding: 12px 15px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    gap: 15px;
    color: var(--text-primary);
    transition: all 0.2s ease;
  }

  .autocomplete-item:last-child {
    border-bottom: none;
  }

  .autocomplete-item:hover {
    background-color: rgba(255, 255, 255, 0.08);
    color: white;
  }

  .autocomplete-item img {
    width: 40px;
    height: 60px;
    object-fit: cover;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  .autocomplete-item .item-title {
    font-size: 1.1rem;
    color: var(--text-secondary);
    font-weight: bold;
    transition: color 0.2s ease;
  }

  .autocomplete-item:hover .item-title {
    color: var(--theme-accent);
  }

  .autocomplete-item .item-year {
    font-size: 0.9rem;
    color: var(--text-primary);
    margin-top: 4px;
  }

  .autocomplete-item .item-type {
    font-size: 0.75rem;
    background: var(--theme-accent-soft);
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 10px;
    color: var(--theme-accent);
    text-transform: uppercase;
    font-weight: bold;
    border: 1px solid rgba(131, 111, 255, 0.3);
  }

  @media (max-width: 600px) {
    .add-movie-main {
      padding: 1rem;
    }

    .add-movie-main h1 {
      font-size: 2rem;
    }

    .add-movie-main form {
      max-width: 100%;
      padding: 0 0.5rem;
    }

    .add-movie-main .field-group {
      grid-template-columns: 1fr;
      gap: 0;
    }

    .add-movie-main .radio-group {
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .add-movie-main .radio-group label {
      width: 100%;
      min-width: unset;
    }

    .add-movie-main .button {
      width: 100%;
      margin-bottom: 6rem;
    }
  }

  /* Scoped Media Preview Confirmation Pill */
  .selected-media-preview {
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(131, 111, 255, 0.08);
    border: 1px solid rgba(131, 111, 255, 0.25);
    border-radius: 12px;
    padding: 6px 12px;
    margin-top: 8px;
    margin-bottom: 16px;
    box-sizing: border-box;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  .selected-media-preview img,
  #previewPosterImg {
    width: 34px !important;
    min-width: 34px !important;
    max-width: 34px !important;
    height: 48px !important;
    min-height: 48px !important;
    max-height: 48px !important;
    border-radius: 6px !important;
    object-fit: cover !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4) !important;
    flex-shrink: 0 !important;
    display: block !important;
  }

  .preview-media-info {
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    min-width: 0;
    flex: 1 1 auto;
  }

  .preview-media-title {
    font-family: "VT323", monospace;
    font-size: 1.3rem;
    color: var(--text-secondary, #ffffff);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }

  .preview-media-sub {
    font-family: "Inter", sans-serif;
    font-size: 0.8rem;
    color: #a5b4fc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .preview-clear-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #cbd5e1;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .preview-clear-btn:hover {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.4);
    color: #fca5a5;
  }

  /* Scoped Season Picker Container & Cards */
  .season-counter-panel {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin-top 0.3s ease;
    margin-top: 0;
  }

  .season-counter-panel.expanded {
    max-height: 500px;
    opacity: 1;
    margin-top: 0.8rem;
    margin-bottom: 1rem;
  }

  .season-picker-container {
    background: rgba(131, 111, 255, 0.06);
    border: 1px dashed rgba(131, 111, 255, 0.3);
    border-radius: 12px;
    padding: 0.8rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    width: 100%;
    box-sizing: border-box;
  }

  .season-picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .season-selected-badge {
    font-family: "VT323", monospace;
    font-size: 1.1rem;
    background: var(--theme-accent-soft, rgba(131, 111, 255, 0.2));
    color: var(--theme-accent, #836fff);
    border: 1px solid rgba(131, 111, 255, 0.3);
    padding: 2px 10px;
    border-radius: 99px;
    letter-spacing: 1px;
  }

  .season-cards-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 2px 8px 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(131, 111, 255, 0.4) transparent;
    -webkit-overflow-scrolling: touch;
  }

  .season-cards-track::-webkit-scrollbar {
    height: 4px;
  }

  .season-cards-track::-webkit-scrollbar-thumb {
    background: rgba(131, 111, 255, 0.4);
    border-radius: 4px;
  }

  .season-card {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    padding: 6px 12px;
    min-width: 140px;
    max-width: 200px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    box-sizing: border-box;
  }

  .season-card:hover {
    background: rgba(131, 111, 255, 0.12);
    border-color: rgba(131, 111, 255, 0.5);
    transform: translateY(-2px);
  }

  .season-card.active {
    background: rgba(131, 111, 255, 0.25);
    border-color: #836fff;
    box-shadow: 0 0 12px rgba(131, 111, 255, 0.35);
  }

  .season-card-poster {
    width: 32px !important;
    min-width: 32px !important;
    max-width: 32px !important;
    height: 48px !important;
    min-height: 48px !important;
    max-height: 48px !important;
    border-radius: 4px !important;
    object-fit: cover !important;
    background: #111;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    flex-shrink: 0 !important;
    display: block !important;
  }

  .season-card-info {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .season-card-title {
    font-family: "VT323", monospace;
    font-size: 1.15rem;
    color: var(--text-secondary, #ffffff);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.1;
  }

  .season-card.active .season-card-title {
    color: #ffffff;
  }

  .season-card-meta {
    font-size: 0.8rem;
    color: var(--text-muted, #94a3b8);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .season-manual-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px dashed rgba(255, 255, 255, 0.08);
    padding-top: 0.6rem;
  }

  .season-manual-label {
    font-family: "VT323", monospace;
    font-size: 1.1rem;
    color: var(--text-muted, #94a3b8);
  }
</style>


<main class="add-movie-main">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="field">
      <input type="text" class="input" id="title" name="title" placeholder=" " autocomplete="off" required />
      <label for="title" class="label">Title</label>
      <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>

    <!-- Selected Media Confirmation Pill -->
    <div class="selected-media-preview" id="selectedMediaPreview" style="display: none; align-items: center; gap: 12px; background: rgba(131, 111, 255, 0.08); border: 1px solid rgba(131, 111, 255, 0.25); border-radius: 12px; padding: 6px 12px; margin-top: 8px; margin-bottom: 16px; box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden;">
      <img id="previewPosterImg" src="" alt="Poster" width="34" height="48" style="width: 34px !important; min-width: 34px !important; max-width: 34px !important; height: 48px !important; min-height: 48px !important; max-height: 48px !important; border-radius: 6px !important; object-fit: cover !important; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4) !important; flex-shrink: 0 !important; display: block !important;" />
      <div class="preview-media-info" style="display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 auto; overflow: hidden;">
        <div class="preview-media-title" id="previewMediaTitle" style="font-family: 'VT323', monospace; font-size: 1.3rem; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;"></div>
        <div class="preview-media-sub" id="previewMediaSub" style="font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #a5b4fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;"></div>
      </div>
      <button type="button" class="preview-clear-btn" onclick="clearSelectedMedia()" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #cbd5e1; font-size: 0.85rem; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s ease; flex-shrink: 0;" title="Clear selection">✕</button>
    </div>

    <input type="hidden" id="tmdb_id" name="tmdb_id" />
    <input type="hidden" id="poster_url" name="poster_url" />
    <input type="hidden" id="year" name="year" />
    {% include 'components/_sentiment_selector.html' %}
    <div class="field">
      <input type="date" class="input" id="date" name="date" required />
      <label for="date" class="label">Watch Date</label>
    </div>

    <!-- Media Type Segmented Toggle -->
    <div class="media-type-section">
      <!-- Hidden Radio Inputs for Form Submit -->
      <input type="radio" name="tv" id="tv_no" value="0" checked hidden />
      <input type="radio" name="tv" id="tv_yes" value="1" hidden />

      <div class="segmented-toggle">
        <button type="button" class="segmented-btn active" id="segment_movie" onclick="setMediaType('movie')">
          <span class="segment-icon">🎬</span>
          <span>Movie</span>
        </button>
        <button type="button" class="segmented-btn" id="segment_tv" onclick="setMediaType('tv')">
          <span class="segment-icon">📺</span>
          <span>TV Series</span>
        </button>
      </div>

      <!-- Collapsible Season Picker Panel -->
      <div class="season-counter-panel" id="seasonField">
        <div class="season-picker-container">
          <div class="season-picker-header">
            <span class="season-label">📺 Choose Season</span>
            <span class="season-selected-badge" id="selectedSeasonBadge">Season 1</span>
          </div>

          <!-- Dynamic Season Cards Carousel -->
          <div class="season-cards-track" id="seasonCardsTrack">
            <!-- Populated dynamically via /api/tv_seasons -->
          </div>

          <!-- Fallback / Manual Stepper Row -->
          <div class="season-manual-row">
            <span class="season-manual-label">Season #:</span>
            <div class="season-stepper">
              <button type="button" class="season-stepper-btn" onclick="stepSeason(-1)">-</button>
              <input type="number" class="season-stepper-input" id="season" name="season" value="1" min="1" readonly />
              <button type="button" class="season-stepper-btn" onclick="stepSeason(1)">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive Context Chips (Cinema & Rewatch) -->
    <input type="radio" name="cinema" id="cinema_yes" value="1" hidden />
    <input type="radio" name="cinema" id="cinema_no" value="0" checked hidden />
    <input type="radio" name="rewatch" id="rewatch_yes" value="1" hidden />
    <input type="radio" name="rewatch" id="rewatch_no" value="0" checked hidden />

    <div class="context-chips-group">
      <div class="context-chip cinema-chip" id="cinema_chip" onclick="toggleCinemaChip()">
        <span class="chip-icon">🍿</span>
        <div class="chip-info">
          <span class="chip-title">Watched in Cinema</span>
        </div>
      </div>

      <div class="context-chip rewatch-chip" id="rewatch_chip" onclick="toggleRewatchChip()">
        <span class="chip-icon">🔄</span>
        <div class="chip-info">
          <span class="chip-title">Rewatch</span>
        </div>
      </div>
    </div>

    <button type="submit" class="button" id="submit-movie-btn">[ SUBMIT ]</button>
  </form>
  <script>
    let currentSeasonsList = [];

    function setMediaType(type) {
      const tvYes = document.getElementById("tv_yes");
      const tvNo = document.getElementById("tv_no");
      const segMovie = document.getElementById("segment_movie");
      const segTv = document.getElementById("segment_tv");
      const seasonPanel = document.getElementById("seasonField");

      if (type === 'tv') {
        tvYes.checked = true;
        tvNo.checked = false;
        segMovie.classList.remove("active");
        segTv.classList.add("active");
        seasonPanel.classList.add("expanded");

        const tmdbId = document.getElementById("tmdb_id").value;
        const titleVal = document.getElementById("title").value;
        if (tmdbId && !currentSeasonsList.length) {
          loadTvSeasons(tmdbId, titleVal);
        }
      } else {
        tvNo.checked = true;
        tvYes.checked = false;
        segTv.classList.remove("active");
        segMovie.classList.add("active");
        seasonPanel.classList.remove("expanded");
      }
    }

    function showSeasonField() {
      setMediaType('tv');
    }

    function hideSeasonField() {
      setMediaType('movie');
    }

    function loadTvSeasons(tmdbId, showTitle) {
      const track = document.getElementById('seasonCardsTrack');
      if (!track) return;

      track.innerHTML = `<div style="font-size: 0.95rem; font-family: 'VT323', monospace; color: var(--text-muted); padding: 8px;">[ LOADING SEASONS... ]</div>`;

      fetch(`/api/tv_seasons?id=${encodeURIComponent(tmdbId)}&title=${encodeURIComponent(showTitle || '')}`)
        .then(res => res.json())
        .then(seasons => {
          currentSeasonsList = seasons || [];
          if (!currentSeasonsList.length) {
            track.innerHTML = `<div style="font-size: 0.95rem; font-family: 'VT323', monospace; color: var(--text-muted); padding: 8px;">Season 1 (Default)</div>`;
            return;
          }
          renderSeasonCards(currentSeasonsList);
        })
        .catch(err => {
          console.error("Error loading seasons:", err);
          track.innerHTML = `<div style="font-size: 0.95rem; font-family: 'VT323', monospace; color: var(--text-muted); padding: 8px;">Use stepper below to select season</div>`;
        });
    }

    function clearSelectedMedia() {
      document.getElementById('title').value = '';
      document.getElementById('tmdb_id').value = '';
      document.getElementById('poster_url').value = '';
      document.getElementById('year').value = '';
      const preview = document.getElementById('selectedMediaPreview');
      if (preview) preview.style.display = 'none';
      currentSeasonsList = [];
      const track = document.getElementById('seasonCardsTrack');
      if (track) track.innerHTML = '';
      setMediaType('movie');
      document.getElementById('title').focus();
    }

    function renderSeasonCards(seasons) {
      const track = document.getElementById('seasonCardsTrack');
      const seasonInput = document.getElementById('season');
      const currentSeasonVal = parseInt(seasonInput.value) || 1;
      track.innerHTML = '';

      seasons.forEach(s => {
        const card = document.createElement('div');
        const isCurrent = s.season_number === currentSeasonVal;
        card.className = `season-card ${isCurrent ? 'active' : ''}`;
        card.id = `season-card-${s.season_number}`;
        card.style.cssText = `
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          gap: 10px;
          background: ${isCurrent ? 'rgba(131, 111, 255, 0.28)' : 'rgba(0, 0, 0, 0.4)'};
          border: 1px solid ${isCurrent ? '#836fff' : 'rgba(255, 255, 255, 0.15)'};
          box-shadow: ${isCurrent ? '0 0 12px rgba(131, 111, 255, 0.35)' : 'none'};
          border-radius: 10px;
          padding: 6px 12px;
          min-width: 140px;
          max-width: 200px;
          cursor: pointer;
          transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
          user-select: none;
          box-sizing: border-box;
        `;
        
        const epText = s.episode_count ? `${s.episode_count} eps` : '';
        const yrText = s.year ? `${s.year}` : '';
        const metaParts = [yrText, epText].filter(Boolean).join(' • ');
        const posterSrc = s.poster || 'https://via.placeholder.com/100x150?text=No+Poster';

        card.innerHTML = `
          <img class="season-card-poster" src="${posterSrc}" alt="Season Poster" width="34" height="50" style="width: 34px !important; min-width: 34px !important; max-width: 34px !important; height: 50px !important; min-height: 50px !important; max-height: 50px !important; border-radius: 4px !important; object-fit: cover !important; background: #111 !important; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4) !important; flex-shrink: 0 !important; display: block !important;" />
          <div class="season-card-info" style="display: flex; flex-direction: column; overflow: hidden; min-width: 0;">
            <div class="season-card-title" style="font-family: 'VT323', monospace; font-size: 1.15rem; color: ${isCurrent ? '#ffffff' : '#e2e8f0'}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.1;">${s.name || 'Season ' + s.season_number}</div>
            ${metaParts ? `<div class="season-card-meta" style="font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #94a3b8; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${metaParts}</div>` : ''}
          </div>
        `;

        card.addEventListener('click', function() {
          selectSeason(s);
        });

        track.appendChild(card);
      });

      const activeSeason = seasons.find(s => s.season_number === currentSeasonVal) || seasons[0];
      if (activeSeason) {
        selectSeason(activeSeason, false);
      }
    }

    function selectSeason(seasonObj, updatePosterInput = true) {
      const seasonInput = document.getElementById('season');
      const posterInput = document.getElementById('poster_url');
      const badge = document.getElementById('selectedSeasonBadge');
      const previewImg = document.getElementById('previewPosterImg');
      const previewSub = document.getElementById('previewMediaSub');

      seasonInput.value = seasonObj.season_number;
      if (updatePosterInput && seasonObj.poster) {
        posterInput.value = seasonObj.poster;
        if (previewImg) previewImg.src = seasonObj.poster;
      }
      if (badge) {
        badge.innerText = seasonObj.name || `Season ${seasonObj.season_number}`;
      }
      if (previewSub) {
        const yrText = seasonObj.year ? `${seasonObj.year}` : '';
        const sName = seasonObj.name || `Season ${seasonObj.season_number}`;
        previewSub.innerText = `${sName}${yrText ? ' • ' + yrText : ''} • TV Series`;
      }

      document.querySelectorAll('.season-card').forEach(c => {
        c.classList.remove('active');
        c.style.background = 'rgba(0, 0, 0, 0.4)';
        c.style.borderColor = 'rgba(255, 255, 255, 0.15)';
        c.style.boxShadow = 'none';
        const titleEl = c.querySelector('.season-card-title');
        if (titleEl) titleEl.style.color = '#e2e8f0';
      });
      const activeCard = document.getElementById(`season-card-${seasonObj.season_number}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.style.background = 'rgba(131, 111, 255, 0.28)';
        activeCard.style.borderColor = '#836fff';
        activeCard.style.boxShadow = '0 0 12px rgba(131, 111, 255, 0.35)';
        const titleEl = activeCard.querySelector('.season-card-title');
        if (titleEl) titleEl.style.color = '#ffffff';
        activeCard.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
      }
    }

    function stepSeason(delta) {
      const input = document.getElementById('season');
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      input.value = val;

      if (currentSeasonsList && currentSeasonsList.length) {
        const matched = currentSeasonsList.find(s => s.season_number === val);
        if (matched) {
          selectSeason(matched);
          return;
        }
      }
      const badge = document.getElementById('selectedSeasonBadge');
      if (badge) badge.innerText = `Season ${val}`;
      document.querySelectorAll('.season-card').forEach(c => c.classList.remove('active'));
    }

    function toggleCinemaChip() {
      const chip = document.getElementById('cinema_chip');
      const yesInput = document.getElementById('cinema_yes');
      const noInput = document.getElementById('cinema_no');

      const isCurrentlyActive = chip.classList.contains('active');
      if (isCurrentlyActive) {
        chip.classList.remove('active');
        noInput.checked = true;
        yesInput.checked = false;
      } else {
        chip.classList.add('active');
        yesInput.checked = true;
        noInput.checked = false;
      }
    }

    function toggleRewatchChip() {
      const chip = document.getElementById('rewatch_chip');
      const yesInput = document.getElementById('rewatch_yes');
      const noInput = document.getElementById('rewatch_no');

      const isCurrentlyActive = chip.classList.contains('active');
      if (isCurrentlyActive) {
        chip.classList.remove('active');
        noInput.checked = true;
        yesInput.checked = false;
      } else {
        chip.classList.add('active');
        yesInput.checked = true;
        noInput.checked = false;
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Default date to today if empty
      const dateInput = document.getElementById('date');
      if (!dateInput.value) {
        dateInput.valueAsDate = new Date();
      }

      const titleInput = document.getElementById('title');
      const autocompleteList = document.getElementById('autocomplete-list');
      let timeout = null;

      titleInput.addEventListener('input', function() {
        clearTimeout(timeout);
        const query = this.value;
        
        // Reset previously selected IDs and previews when title is manually modified
        document.getElementById('tmdb_id').value = '';
        document.getElementById('poster_url').value = '';
        const preview = document.getElementById('selectedMediaPreview');
        if (preview) preview.style.display = 'none';
        currentSeasonsList = [];
        const track = document.getElementById('seasonCardsTrack');
        if (track) track.innerHTML = '';
        
        if (!query || query.length < 2) {
          autocompleteList.innerHTML = '';
          return;
        }

        timeout = setTimeout(() => {
          const isTv = document.getElementById('tv_yes').checked ? "1" : "0";
          fetch(`/search_tmdb?q=${encodeURIComponent(query)}&tv=${isTv}`)
            .then(response => response.json())
            .then(data => {
              autocompleteList.innerHTML = '';
              data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                const typeLabel = item.type === 'tv' ? 'TV' : 'Movie';
                div.innerHTML = `
                  <img src="${item.poster}" alt="Poster" />
                  <div class="info">
                    <div class="item-title">${item.title} <span class="item-type">${typeLabel}</span></div>
                    <div class="item-year">${item.year}</div>
                  </div>
                `;
                div.addEventListener('click', function() {
                  titleInput.value = item.title;
                  document.getElementById('year').value = item.year || '';
                  document.getElementById('tmdb_id').value = item.id || '';
                  document.getElementById('poster_url').value = item.poster_w500 || item.poster || '';
                  
                  // Update Media Preview Badge
                  const preview = document.getElementById('selectedMediaPreview');
                  const previewImg = document.getElementById('previewPosterImg');
                  const previewTitle = document.getElementById('previewMediaTitle');
                  const previewSub = document.getElementById('previewMediaSub');
                  if (preview && previewImg && previewTitle) {
                    preview.style.display = 'flex';
                    previewImg.src = item.poster_w500 || item.poster || '';
                    previewTitle.innerText = item.title;
                    previewSub.innerText = `${item.year || ''} • ${item.type === 'tv' ? 'TV Series' : 'Movie'}`;
                  }

                  if (item.type === 'tv') {
                    setMediaType('tv');
                    loadTvSeasons(item.id, item.title);
                  } else {
                    setMediaType('movie');
                    currentSeasonsList = [];
                    const track = document.getElementById('seasonCardsTrack');
                    if (track) track.innerHTML = '';
                  }

                  autocompleteList.innerHTML = '';
                });
                autocompleteList.appendChild(div);
              });
            })
            .catch(err => console.error("Error fetching autocomplete:", err));
        }, 300);
      });

      // Close autocomplete when clicking outside
      document.addEventListener('click', function(e) {
        if (e.target !== titleInput && e.target !== autocompleteList && !autocompleteList.contains(e.target)) {
          autocompleteList.innerHTML = '';
        }
      });

      // Submit feedback & double-click protection
      const movieForm = document.querySelector('.add-movie-main form');
      const submitBtn = document.getElementById('submit-movie-btn');
      if (movieForm && submitBtn) {
        movieForm.addEventListener('submit', function() {
          submitBtn.disabled = true;
          submitBtn.innerText = '[ ADDING... ]';
        });
      }
    });
  </script>
</main>

{% endblock %}
