{% extends "base.html" %}
{% block title %}Kineto | Archive{% endblock %}
{% block body_class %} landing-private-lounge{% endblock %}
{% block content %}

<canvas class="canvas_landing" id="canvas"></canvas>

<main class="lounge-container" id="parallax-target">
  <div class="glass-gate">
    <h1 class="lounge-title">KINETO</h1>
    <p class="lounge-subtitle">Private Archive</p>

    <div class="gate-actions" aria-label="Private access actions">
      <a href="/login" class="gate-link">Enter</a>
      <span class="divider">/</span>
      <a href="/register" class="gate-link">Join</a>
    </div>
  </div>
</main>

<script src="static/js/script.js"></script>
{% endblock %}
