{% extends 'base.html' %} {% block title %}Discover{% endblock %} {% block
body_class %} explore_page{% endblock %}{% block content%}

<main>
  <section class="explore-shell app-panel">
    <h2 class="explore-title app-title-terminal"><span>//</span> Trending on Kineto</h2>
    <section class="carta-list explore-cards" id="scrollableSection">
      {% for m in movies %}
      <a href="/tmdb_redirect?title={{m['movie'] | urlencode}}&tv={{'1' if m.get('tv_show') else '0'}}" target="_blank" style="text-decoration: none;">
        <article class="movie-frame">
          <img src="{{m.poster}}" alt="{{m.movie}}" class="movie-poster" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/500x750/0f172a/7eb5c4?text=No+Poster';">
          <div class="frame-overlay">
            <div class="overlay-content">
              <h3 class="frame-title">{{m.movie.upper()}}</h3>
              <div class="frame-meta">
                <span class="meta-item">{{m.p_year}}</span>
                <span class="meta-item divider">•</span>
                <span class="meta-item">{{m.director}}</span>
              </div>
            </div>
          </div>
        </article>
      </a>
      {% endfor %}
    </section>
  </section>
</main>
{% endblock %}
<script>
  const scrollableSection = document.getElementById("scrollableSection");
  const hasFinePointer = window.matchMedia("(pointer: fine)").matches;

  if (scrollableSection && hasFinePointer) {
    let isScrolling = false;
    let targetScrollLeft = 0;

    scrollableSection.addEventListener("wheel", (event) => {
      event.preventDefault();
      const scrollAmount = event.deltaY;
      targetScrollLeft += scrollAmount;

      if (!isScrolling) {
        requestAnimationFrame(scrollSmooth);
        isScrolling = true;
      }
    });

    function scrollSmooth() {
      scrollableSection.scrollLeft +=
        (targetScrollLeft - scrollableSection.scrollLeft) * 0.1;

      if (Math.abs(targetScrollLeft - scrollableSection.scrollLeft) < 0.1) {
        scrollableSection.scrollLeft = targetScrollLeft;
        isScrolling = false;
      } else {
        requestAnimationFrame(scrollSmooth);
      }
    }
  }
</script>
